[project]
name = "asicode"
version = "0.2.22"
description = "Autonomous Software Improvement — AST-precise code editing agent with verification gates (CLI + MCP server)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "socialherb", email = "junddory@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.0",
  "requests>=2.31",
  "rich>=13.7,<15",  # <15: rich 15 changes PTY output routing (_MarginIO→capture), breaking pty-driven input/truncation tests on CI
  "libcst>=1.4",  # format-preserving CST transformations for Python
  "prompt-toolkit>=3.0",  # terminal input handling (IME/wide-char/paste)
  "httpx>=0.27",  # web_search_tools HTTP client
  "ruff>=0.6",  # post-edit verification: F821 undefined-name checks (silently skipped when absent)
  # Tree-sitter grammars for precise AST-based symbol/call/import detection.
  # tree-sitter-language-pack (~2 MB) bundles 300+ prebuilt grammars with full
  # platform wheel coverage. Core dependency: without it providers fall back to
  # regex heuristics, which contradicts the AST-over-regex design principle.
  # The loader also still resolves individual tree_sitter_<lang> modules.
  "tree-sitter-language-pack>=1.10",
  # The tree-sitter CORE, pinned below 0.26 — and declared at all, which it was
  # not. Only tree-sitter-language-pack was listed, and its own metadata says
  # bare `Requires: tree-sitter` with no bound, so a fresh install resolved the
  # core to whatever was newest. On 0.26.0 that segfaults.
  #
  # Measured in a clean python:3.12-slim container, 20 trials per combination of
  # `SymbolSearcher.get_file_outline()` over one ordinary Python file:
  #
  #     core 0.26.0 + pack 1.13.5 -> 7/20 crashed
  #     core 0.26.0 + pack 1.12.5 -> 9/20 crashed
  #     core 0.25.2 + pack 1.13.5 -> 0/20
  #     core 0.25.2 + pack 1.12.5 -> 0/20
  #
  # So the core decides and the pack is irrelevant. The crash is a SIGSEGV
  # inside the node walk (get_node_text -> node.start_byte), nondeterministic
  # and landing at a different site each run — GC, fork, realpath — which is
  # why a single passing trial proves nothing here; the rate is only ~35-45%.
  #
  # This is NOT a test-only concern: get_file_outline is on the read_file path
  # (_over_cap_guidance, for files past the output cap), so a plain
  # `pip install asicode` could segfault the CLI on an ordinary large-file read.
  # The dev environment masked it by having core 0.25.2 already pinned.
  #
  # Revisit by re-running the trial matrix against a newer core, not by reading
  # release notes — and require a full 20-trial zero before raising the bound.
  "tree-sitter>=0.25,<0.26",
  # PEP 440 version comparison for the update-notice check
  # (utils/version_check.py). NOT implicitly present in a base install —
  # only pytest pulled it in dev envs — and the string-inequality fallback
  # fires bogus notices on downgrades, so declare it explicitly.
  "packaging>=21",
]

[project.optional-dependencies]
# FastAPI webapp (server/UI) — private-repo development only; the published
# package does not ship the webapp/ package, so this extra is meaningless
# for installed users and is intentionally NOT part of [all].
webapp = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
]
vulture = [
    "vulture>=2.11",
]
# Claude Agent SDK — optional dependency for multi-agent collaboration features
# (external_llm/repl/collaborate/*). Imported lazily so the core works without it.
# Install with: pip install '.[collaborate]'
collaborate = [
    "claude-agent-sdk>=0.2",
]
# RAG (vector search & embedding) — sentence-transformers + faiss + numpy
# Used by: external_llm/agent/vector_cache.py (lazy import)
# Install with: pip install '.[rag]'
rag = [
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "numpy>=1.24",
]
# Vision (OCR & image processing) — Pillow + pytesseract
# Used by: providers.py read_image (lazy import)
# Install with: pip install '.[vision]'
vision = [
    "Pillow>=10.0",
    "pytesseract>=0.3",
]
# Browser automation — Playwright
# Used by: browser_tools.py (lazy import)
# Install with: pip install '.[browser]'
browser = [
    "playwright>=1.40",
]
# Config — YAML
# Used by: multi_planner.py (lazy import)
# Install with: pip install '.[config]'
config = [
    "pyyaml>=6.0",
]
# Dev & test
# Install with: pip install '.[dev]'
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.6",
    "pytest-timeout>=2.3",  # Prevent hung tests from blocking CI (300s default timeout)
    "coverage>=7.4",        # scripts/cov.sh measurement + CI coverage gate (a1_coverage.pth uses process_startup(slug=...))
    "pre-commit>=4.0",
]

# Type-checking. ruff is a core dependency (always installed with the package);
# mypy + pyright are pulled in by this extra so `pip install '.[lint]'` provides the
# full Python type-checking toolset. `pyright[nodejs]` ships a pinned Node.js runtime
# inside the wheel via nodejs-wheel (the upstream-recommended, more reliable path vs.
# the default nodeenv), so this extra also satisfies the startup semantic-validation
# tool check (dependency_checker) without requiring a system npm/Node install.
# tsc has no pip equivalent — install it separately via `npm install -g typescript`.
# Install with: pip install '.[lint]'
lint = [
    "mypy>=1.10",
    "pyright[nodejs]>=1.1",
]

# Fast code search. ripgrep is OPTIONAL, not a hard dependency: kept out of the
# core install so a ripgrep install failure (sdist build on platforms without a
# prebuilt wheel — e.g. Windows, macOS-x86_64, linux-aarch64, musl) cannot break
# the base install. When rg is absent, symbol search degrades GRACEFULLY — Python
# symbols (via AST) still resolve, while non-Python symbol search (which needs rg
# to walk/index provider files) returns empty instead of crashing. Install rg for
# full multi-language symbol search: pip install '.[search]'
search = [
    "ripgrep>=15.0",
]

# All-in-one — install everything with: pip install '.[all]'
# (webapp is excluded: the published package does not ship webapp/)
all = [
    "asicode[vulture]",
    "asicode[collaborate]",
    "asicode[rag]",
    "asicode[vision]",
    "asicode[browser]",
    "asicode[config]",
    "asicode[lint]",
    "asicode[search]",
]

[project.urls]
Homepage = "https://github.com/socialherb/asicode"
Repository = "https://github.com/socialherb/asicode"
Issues = "https://github.com/socialherb/asicode/issues"

[project.scripts]
asi = "asi:main"
asicode = "asi:main"

[tool.setuptools]
py-modules = ["asi", "common", "config", "context_collector", "diff_apply", "patch_synth", "path_security", "plan_compiler"]

# CLI-only distribution: the wheel ships only what the `asi` CLI reaches at
# runtime. Excluded from the package (still in the repo, used by webapp/dev):
#   - webapp*  — FastAPI server/UI, not part of the CLI deployment
#   - tools*   — dev/verification scripts
[tool.setuptools.packages.find]
where = ["."]
include = ["external_llm*", "services*", "utils*"]

[build-system]
# >=77: PEP 639 SPDX `license = "MIT"` + `license-files` support
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.coverage.run]
source = ["external_llm", "webapp", "asi"]
concurrency = ["multiprocessing"]
parallel = true

[tool.coverage.report]
# Coverage ratchet (P-6): enforced by scripts/cov.sh in lint.yml's unit job
# (`tests/unit -q -m "not slow"`). Baseline 93% measured 2026-08-16 (macOS,
# 62885 stmts, ~15690 passed / 1 flaky failure).
#
# First observation run (this commit, macOS, coverage 7.14.3): TOTAL 91.945%
# (62883 stmts, 5065 missing) via the exact CI command
# `./scripts/cov.sh tests/unit -q -m "not slow"` (15686 passed / 9 failed /
# 2 skipped / 4 xfailed; all 9 failures were parallel-session WIP races in
# pty/stage3 files — they pass in isolation). There is no CI remote yet, so
# this local CI-parity run is the gate's first observation.
# Ratchet at 90: the 8-point margin was for the pre-first-observation
# uncertainty; now that the number is seen, ~2pp guards ubuntu-vs-macOS
# drift, run-to-run flake and subprocess data files that fail to combine.
# Tighten further after a few green CI runs. COV_FAIL_UNDER=0 (release.yml)
# disables the gate for report-only runs.
# P-I re-measurement (2026-08-16, post-P-3): TOTAL 95% (62883 stmts,
# 3262 missing) via `./scripts/cov.sh tests/unit -q` (15717 passed / 3
# failed / 2 skipped / 4 xfailed / 598s; the 3 failures were parallel-session
# WIP races in test_repl_stage3_auto_collab_red_green.py, pass in isolation).
# Run-to-run variance observed 88-95%: pty/subprocess data that fails to
# combine and flaky collab scenarios dominate the swing. Failures of the
# pty tests also drag the total down when they abort early (xdist worker
# data loss), so the ratchet stays at 90 until CI is green consistently.
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "except ImportError:",
    "raise NotImplementedError",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest 9.0+ importlib mode (#11475) imports test modules via the standard
# import mechanism WITHOUT touching sys.path. The editable install maps only
# the shipped packages (external_llm, config, ...), NOT webapp, so any test
# file with a top-level `import webapp` failed collection. pythonpath is the
# documented mechanism to put the repo root on sys.path in all modes/workers.
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: integration tests (require external resources)",
    "unit: unit tests (isolated, fast)",
    "slow: slow tests (deselected by default; PR/lint jobs skip, release runs them)",
    "network: tests that require network access",
]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--import-mode=importlib",
    # -n auto: pytest-xdist default parallelism. Verified 2026-08-01 under
    # 8-way: unit 12190 passed / 0 failed / 12 skipped / 4 xfailed in 2:46,
    # integration 382 passed / 0 failed / 14 xfailed in 0:19. Serial
    # debugging: override with `pytest -n 0`.
    # NOTE: pytest 9 passes each addopts element to argv verbatim (no shlex
    # split) — "-n auto" as ONE element parses as value ' auto' and fails, so
    # the flag and its value must be separate elements.
    "-n",
    "auto",
]
# Coverage measurement: `coverage run -m pytest` is WRONG under -n auto —
# xdist workers are separate interpreters, so it records only the main
# process (~0%, measured 2026-08-16). Always measure via scripts/cov.sh:
# it sets COVERAGE_PROCESS_START (a1_coverage.pth injects every process) +
# a private COVERAGE_FILE, then combine+report.
# ASICODE_SHOW_WARNINGS=1: show all Python warnings (default: only errors shown via filterwarnings)
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
# pytest-timeout: make the "prevent hung tests from blocking CI" dependency
# actually active — the plugin has NO default without this ini/flag. 300s per
# test is far above any legitimate test here (slowest measured: ~47s).
timeout = 300

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# === Rule selection ===
# Stage 1: auto-fixable essentials (low noise, high value)
# Stage 2+: gradually expand as baseline issues are resolved
select = [
    "E",    # pycodestyle errors (all categories)
    "F",    # pyflakes (undefined names, unused imports)
    "I",    # isort (import sorting)
    "N",    # pep8-naming (naming conventions)
    "UP",   # pyupgrade (modernize for 3.10+)
    "W",    # pycodestyle warnings (trailing-whitespace, blank-line-whitespace)
    "B",    # flake8-bugbear (likely bugs)
    "ASYNC",# flake8-async (async patterns)
    "RUF",  # ruff-specific rules
    "PT011", # pytest.raises without match — test expectations pinned (A2)
    "TRY004",# type checks must raise TypeError, not ValueError (A3)
    "PLW1510",# subprocess.run must pass explicit check= — every site pinned (PLW1510 round; enforced by the full-scan gate)
    "PLR5501",# else-if → elif (collapsible-else-if, P-4 round)
    "PLR0402",# import x.y → from x import y (consider-using-from-import, P-4 round)
    "PLC0207",# split() maxsplit reduction (unnecessary-string-split, P-4 round)
    "PLR1730",# manual min/max/clamp → builtin (prefer-min-max, P-4 round)
    "PLR1711",# trailing bare return (useless-return, P-4 round)
    "SIM102", # nested if → and-merged single if (P-2 round: 149건 전량 정리, full-scan gate 강제)
    "SIM103", # needless-bool — return the condition directly (P-2 round: 17건, 주석 보존 수동 3건 포함)
    "SIM114", # if/elif with identical arms → or-merged condition (P-2 round: 38건 + 주석 보존)
    "SIM115", # open → with context manager (P-2 round: 6건 — with 변환 1 + 구조적 예외 noqa 5)
    "SIM108", # if-else-block → ternary (P-2 round: 52건 — unsafe-fix 46 + 주석 보존 수동 6, 병렬 WIP 2건 제외)
    "PLC0414",# useless-import-alias (P-4 continuation round)
    "PLC2401",# non-ascii-name (P-4 continuation round)
    "PLR1714",# repeated eq comparisons → membership test (P-4 continuation round)
    "PLC0206",# dict iteration without .items() (P-4 continuation round)
    "PLR1704",# redefined-argument-from-local (P-4 continuation round)
    "SIM300", # yoda-conditions — constants on the right side (P-2 round: 9건)
    "SIM910", # dict.get(k, None) → dict.get(k) (P-2 round: 7건)
    "TRY203", # immediate re-raise except → must do real work (P-1 round: 1건 — unguarded-subprocess 게이트가 try 필요, 메시지 강화로 해결)
    "SIM118", # key in dict.keys() → key in dict (P-1 round: 3건)
    "SIM117", # nested with → single multi-context with (P-2 round: 17건 — auto 10 + 수동 7)
    "SIM110", # for-loop with early return True → any() (P-3 round: 7건 — 전부 순수 비교 루프, 수동 변환)
    "RET505", # superfluous-else-return → early return (P-2 round: 64건 — 전부 auto-fix)
    "RET506", # superfluous-else-raise (P-2 round: 1건)
    "RET507", # superfluous-else-continue (P-2 round: 1건)
    "RET508", # superfluous-else-break (P-2 round: 3건)
    "SIM101", # duplicate-isinstance-call → tuple merge (P-5 round: 6건 — unsafe-fix, 전부 동등)
    "SIM113", # manual index counting → enumerate(start=1) (P-5 round: 3건 — 수동 변환, n_total/_ts_count/emitted)
    "SIM211", # False if not X else True → bool(X) (P-5 round: 1건 — unsafe-fix 후 bool()으로 다듬음)
    "SIM222", # x or True → True (P-5 round: 1건 — no-op assertion을 실제 검증 assert updated != initial로 회복)
    "SIM105", # try-except-pass → contextlib.suppress (P-6 round: 114건 — unsafe-fix 97 + 주석 보존 수동 17, 전부 동등)
    "C401", # set(generator) → set comprehension (P-1 round: 10건 — unsafe-fix, 전부 동등)
    "C408", # dict() → dict literal (P-1 round: 13건 — unsafe-fix, 전부 동등)
    "C414", # unnecessary double cast — sorted(list(...)) → sorted(...) (P-1 round: 6건)
    "C416", # unnecessary comprehension — {k: v for k, v in items()} → dict(items()) (P-1 round: 3건)
    "C420", # unnecessary dict comprehension → dict.fromkeys(...) (P-1 round: 10건 — safe-fix)
    "RET501", # unnecessary-return-none: annotated-return (P-8 round: 0건)
    "RET502", # unnecessary-return-none: explicit-return (P-8 round: 0건)
    "RET503", # missing explicit return at end of non-None function (P-8 round: 3건 — fix 1 + invariant raise 1 + noqa 1)
    "RET504",# unnecessary-assign-before-return (P-7 round: 60건 — unsafe-fix, 전부 동등, 주석 1건 복원)
    "TRY400",# logging .error in except must be .exception (P10-4: 54건 unsafe-fix + G201 수동 10건 — 트레이스백 유실 복구)
    "G201",  # .error(..., exc_info=True) → .exception(...) (P10-4: 10건 수동 — 의미 동등)
    "G202",  # redundant exc_info kwarg — exception(exc_info=True) (P10-4 재검증: TRY400/G201 이미 활성 확인, G202 실측 0건 + 샌드박스 발화 검증)
    # NOTE: "B904" (raise-without-from) is NOT listed here — it is already
    # active under the "B" (flake8-bugbear) prefix above. The P-9 round added
    # a per-rule entry that was a no-op; scripts/check_select_not_redundant.py
    # now rejects such redundant entries (P10-1).
    "PIE810", # multiple-starts-ends-with → tuple merge (P11 round: 62건 — unsafe-fix 전수 심사, 리터럴/f-string 인자만, 동등 확인)
    "PIE790", # unnecessary-pass (P10-6 part 1: 36건 docstring 뒤 pass 정리 / part 2: 16건 except trailing pass — 주석 승격 5건 포함, 의미 동등)
    "G001",  # logging-string-format (.format()) → lazy %-format (P13 round: 실측 0건 + 샌드박스 발화 5건 확인 — 이 버전 fix 미지원, 신규 위반은 수동)
    "G002",  # logging-percent-format (eager % 연산) → lazy %-format (P13 round: 실측 0건 + 샌드박스 발화 2건 확인 — lazy "%.200s", arg 형태는 대상 아님, fix 미지원)
    "G004",  # logging-f-string → lazy %-format (P12 round: 142건 수동 변환 — 이 버전 fix 미지원, 전수 심사: 리터럴/표현식 인자 이동, %r/%.1f 대응, 하이브리드 8건 label 인자화)
    "G010",  # logging-warn → warning (P12 round: 실측 0건 + 샌드박스 발화 2건 확인 — safe-fix)
    "TRY300",# return in try → else block (TRY300 round: 131건 else 이동 + lazy-import 1건 noqa(asi.py:461) — 전부 예외 불가 식(Call 0건)이라 의미 동등, 5161 tests 검증)
]
# Rules excluded globally (enable gradually after baseline cleanup):
ignore = [
    "E501",         # line-too-long: 16,665 violations — enable after bulk cleanup
    "N802",         # invalid-function-name: 101 violations (test helpers, legacy)
    "N806",         # non-lowercase-variable-in-function: 449 violations
    "N999",         # invalid-module-name: 46 violations (from __init__ re-exports)
    "UP037",        # quoted-annotation: 902 violations — enable after staged migration
    "UP045",        # non-pep604-annotation-optional: 2,845 violations — staged migration
    "ASYNC100",     # async-function-with-no-await: too noisy for mixed sync/async
]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "N802",   # test function names use snake_case convention differently
    "N806",   # non-lowercase variable allowed in tests
    "ASYNC100",
]
# E402 (module-level import not at top of file): tests deliberately group
# imports by test section — keeps collection light and avoids import-time side
# effects (importorskip gates, heavy-module avoidance; the reasons are
# documented at each site). Same convention as "tests/*" naming entries.
"tests/**" = [
    "E402",
]
"tools/*" = [
    "N802",
    "N806",
    "E402",   # section-local imports after sys.path bootstrap (script convention)
]
"__init__.py" = [
    "N999",   # __init__.py module names match package
]

# RUF102: `# noqa: V1xx` — vulture's own error codes (V101-V107) are not ruff
# rules. The scanner implements the flake8-style V-code noqa contract, so these
# directives document audited intentional/unused-looking code (stdlib callback
# overrides, framework contract attrs, re-exports, library API attrs).
"external_llm/agent/tool_handlers/web_search_tools.py" = ["RUF102"]
"external_llm/agent/tool_handlers/write_tools_core.py" = ["RUF102"]
"external_llm/languages/libcst_utils.py" = ["RUF102"]
"webapp/main.py" = ["RUF102"]   # V-code noqa contract: FastAPI fallback stub catch-alls + mount_ui fallback signature

# RUF001: ambiguous-unicode-in-string — audited 2026-08-07: every occurrence is
# an intentional display convention, not a logic string: range notation "5–7"
# (read_tools.py output + its test fixtures), multiplication "3×" (bench/LLM
# hints), console symbols "❯ ℹ ➕ ➖" (REPL/verifier UI), U+2212 sign alignment
# (asi.py +/- columns), decorative-char translation keys (plan_compiler.py),
# and str.splitlines() break-char fixtures (test_read_file_streaming.py).
"external_llm/agent/tool_handlers/read_tools.py" = ["RUF001"]
"external_llm/agent/failure_pattern_store.py" = ["RUF001"]
"external_llm/providers.py" = ["RUF001"]
"external_llm/repl/collaborate/verdict.py" = ["RUF001"]
"external_llm/repl/repl_impl.py" = ["RUF001"]
"plan_compiler.py" = ["RUF001"]
"asi.py" = ["RUF001", "RUF102"]
"tests/unit/agent/test_read_file_output_budget.py" = ["RUF001"]
"tests/unit/agent/test_read_file_streaming.py" = ["RUF001"]
"tests/unit/agent/test_orchestrator.py" = ["RUF001"]
"tools/agent_behavior_analyzer.py" = ["RUF001"]
"tools/ast_diff_verifier.py" = ["RUF001"]
"tools/checkpoint_batch.py" = ["RUF001"]
"tools/patch_strategy_bench.py" = ["RUF001"]

# ast.NodeVisitor callback assignments (visit_<NodeName> = <method>) are
# mixedCase by API contract — N815 is inapplicable to this dispatch pattern.
# RUF102 too: `# noqa: V1xx` directives (vulture's own codes) are not ruff
# rules; see the RUF102 block above.
"external_llm/analysis/container_reachability_scanner.py" = ["N815"]
"external_llm/analysis/vulture_scanner.py" = ["N815", "RUF102"]
"external_llm/graph/repository_graph.py" = ["N815"]
"external_llm/agent/tool_handlers/write_tools_edit_mixin.py" = ["N815"]
"scripts/check_no_new_silent_except.py" = ["N815"]
"scripts/check_no_new_unguarded_subprocess.py" = ["N815"]
