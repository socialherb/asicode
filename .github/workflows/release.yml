name: Release (PyPI Trusted Publishing)

# Build sdist + wheel from the tagged public-snapshot commit and publish to
# PyPI via Trusted Publishing (OIDC). No API token is stored anywhere: PyPI
# issues a short-lived upload credential to this workflow after the project
# owner registers it as a trusted publisher (one-time, browser):
#
#   https://pypi.org/manage/project/asicode/settings/publishing/
#     PyPI Project Name : asicode
#     Owner             : socialherb
#     Repository name   : asicode
#     Workflow name     : release.yml
#     Environment name  : (leave blank)
#
# Trigger: pushing a `v*` tag to socialherb/asicode. The tag is produced by
# scripts/release_public.py (--tag --push) and points at the release commit,
# so the build always runs on exactly the shipped source — a CI checkout of a
# tag is a clean detached tree, equivalent to `git archive <tag>` extraction
# (NOT a dirty working tree). This keeps the release-build discipline intact.
#
# Idempotency: PyPI rejects re-uploads of identical files, so re-running this
# workflow on an already-published tag fails safely at the publish step.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Never cancel a release mid-flight; queue concurrent tag pushes.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Behaviour gate in front of an IRREVERSIBLE upload. Until this existed the
  # only thing between a tag push and PyPI was `twine check` (metadata) plus an
  # import smoke — nothing ran a single test, because the private repo has no
  # remote, so `lint.yml` (then ruff/AST checks only) was the only workflow
  # that ever executed.
  #
  # This runs against the EXPORTED tree, which is what the public repo and the
  # wheel contain — lane/, webapp/, tools/ and their coupled tests are absent
  # here. That distinction matters: a clean install of the exported tree found a
  # segfault the private tree could not (see the tree-sitter core pin), because
  # the development environment already held a working core.
  #
  # ripgrep is installed explicitly rather than relied upon: several read-path
  # tests need it, and pinning its presence keeps the job deterministic instead
  # of tracking whatever the runner image happens to ship.
  test:
    name: Unit tests (exported tree, clean install)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ripgrep
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep

      - name: Install package + test dependencies
        run: |
          python -m pip install --upgrade pip
          # Pin ruff to match the local developer ruff AND lint.yml (see
          # .pre-commit-config.yaml); the format gate in check_lint_full.py
          # must see the same formatter as local development. Unpinned
          # `ruff>=0.6` drifted to 0.16.4 on 2026-08-23, whose markdown
          # formatter promoted preview → stable and flagged 3 docs/*.md files
          # as drift, failing test_clean_repo_not_reported and blocking the
          # v0.2.29 publish.
          python -m pip install ruff==0.15.21
          python -m pip install -e '.[dev]'

      - name: Unit tests
        # Hung-test protection comes from the pyproject.toml pytest-timeout ini
        # default (`timeout = 300`) — no CLI flag, same source of truth as
        # lint.yml's unit/integration jobs.
        # No deselections: every test in tests/unit runs on the exported tree.
        # The five that were previously --deselect-ed were each fixed to run in
        # CI, so the gate is clean rather than carrying permanent debt (a
        # perpetually-red gate trains everyone to bypass it):
        #
        #   * test_symbol_search_rg_absent (2) — rewrote from a subprocess that
        #     scrubbed rg out of PATH (which cannot reliably hide /usr/bin/rg on
        #     a runner where rg, git and the interpreter share that dir, and rg
        #     is reachable from PATH entries a single which() does not enumerate)
        #     to a DETERMINISTIC monkeypatch of shutil.which + subprocess.run at
        #     the symbol_search module level. It fires the exact FileNotFoundError
        #     every rg call site must catch, on any host, rg installed or not.
        #   * test_shell_shims::test_missing_command — made platform-aware: macOS
        #     (shim active) asserts rc=1/"missing command"; Linux (real GNU
        #     timeout, shim inert) asserts rc=125/"missing operand" (measured in
        #     a clean python:3.12-slim container).
        #   * test_ast_cache_mutation_guard and test_operation_kind_landmine_guard
        #     — both scan external_llm/, which in the export is a STRICT SUBSET
        #     of the private tree (lane/ and other private editor subpackages are
        #     dropped). A subset of a clean tree is clean, so they pass; verified
        #     by running both against a locally-built export snapshot. The
        #     "different file set" hunch that originally deselected them was wrong.
        #
        # Coverage: measured via scripts/cov.sh (same wrapper as lint.yml) so
        # the release run carries coverage data too, but REPORT-ONLY:
        # COV_FAIL_UNDER=0 keeps the publish pipeline from being blocked by the
        # fail_under ratchet, which is tuned to lint.yml's deselected suite —
        # a release gate must not depend on a coverage percentage.
        run: |
          COV_DIR=coverage-data PYTHON=python COV_FAIL_UNDER=0 ./scripts/cov.sh tests/unit -q

      - name: Upload coverage data (raw, for re-reporting)
        # if: always() — a failing test run is exactly when the coverage
        # picture is most valuable for triage; the default is to skip upload
        # whenever the job fails.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-release
          path: coverage-data/coverage
          if-no-files-found: error

  publish:
    name: Build and publish to PyPI
    # The gate. A failing test job blocks the upload; PyPI rejects re-uploads,
    # so there is no undo once publish runs. Note the tag is already pushed by
    # the time this fails — recovery is fix, delete the tag, re-tag.
    needs: test
    runs-on: ubuntu-latest
    # id-token: write is required for PyPI Trusted Publishing (OIDC): the
    # pypa/gh-action-pypi-publish action mints a short-lived upload token from
    # it when no `password` is supplied. No long-lived API token is ever stored.
    permissions:
      id-token: write
    steps:
      - name: Checkout tagged commit (clean source)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PEP 517 build frontend
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build twine

      - name: Build sdist + wheel
        # Build isolation installs [build-system].requires (setuptools>=77,
        # wheel) into a throwaway env, so the runner Python version never
        # constrains the build backend.
        run: python -m build

      - name: Verify distribution metadata
        run: python -m twine check dist/*

      - name: Smoke-test installed wheel (importability)
        # twine check only validates metadata/README rendering — it does NOT
        # prove the wheel actually imports. This clean-venv install + `import`
        # + `asi --version` smoke catches the failure class that caused the
        # 0.2.6 incident (modules silently excluded from the wheel → fail-open
        # disable at runtime) and any bare import of a wheel-excluded package
        # (e.g. the lane package). It also exercises the --version flag.
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install --upgrade pip
          /tmp/smoke/bin/python -m pip install dist/*.whl
          /tmp/smoke/bin/python -c "import asi; print('import asi OK')"
          /tmp/smoke/bin/asi --version

      - name: Publish to PyPI (OIDC, no stored token)
        uses: pypa/gh-action-pypi-publish@release/v1
